<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Vault</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: rgba(22, 31, 48, 0.65);
      --surface-hover: rgba(30, 42, 65, 0.85);
      --surface-solid: #151d2a;
      --border: rgba(255, 255, 255, 0.08);
      --border-accent: rgba(59, 130, 246, 0.4);
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #3b82f6;
      --accent-glow: rgba(59, 130, 246, 0.35);
      --success: #10b981;
      --danger: #ef4444;
      --warning: #f59e0b;
      --radius: 16px;
      --shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient Animated Glows */
    body::before, body::after {
      content: '';
      position: fixed;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      filter: blur(120px);
      z-index: -1;
      pointer-events: none;
      animation: ambientPulse 12s infinite alternate ease-in-out;
    }

    body::before {
      background: rgba(59, 130, 246, 0.15);
      top: -100px;
      left: -100px;
    }

    body::after {
      background: rgba(99, 102, 241, 0.12);
      bottom: -100px;
      right: -100px;
      animation-delay: -6s;
    }

    @keyframes ambientPulse {
      0% { transform: scale(1) translate(0, 0); }
      100% { transform: scale(1.3) translate(50px, 30px); }
    }

    /* ========== LOCK SCREEN ========== */
    #lock-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      opacity: 1;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #lock-screen.hide {
      opacity: 0;
      transform: scale(0.96);
      pointer-events: none;
      position: absolute;
      inset: 0;
    }

    .lock-card {
      background: var(--surface);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 44px 36px;
      width: 100%;
      max-width: 420px;
      box-shadow: var(--shadow);
      text-align: center;
      animation: floatIn 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes floatIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .lock-icon {
      width: 68px;
      height: 68px;
      margin: 0 auto 24px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      box-shadow: 0 10px 25px var(--accent-glow);
      transition: transform 0.3s ease;
    }

    .lock-card:hover .lock-icon {
      transform: scale(1.05) rotate(-3deg);
    }

    .lock-card h1 {
      font-size: 1.75rem;
      margin-bottom: 8px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .lock-card p {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 28px;
    }

    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      font-weight: 500;
    }

    input[type="password"],
    input[type="text"],
    input[type="url"],
    textarea {
      width: 100%;
      padding: 12px 16px;
      background: rgba(10, 15, 26, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      font-size: 0.95rem;
      outline: none;
      transition: all 0.25s ease;
    }

    input:focus, textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px var(--accent-glow);
      background: rgba(10, 15, 26, 0.8);
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 12px 20px;
      border: none;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .btn:active {
      transform: scale(0.97);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #2563eb);
      color: white;
      width: 100%;
      box-shadow: 0 4px 15px var(--accent-glow);
    }

    .btn-primary:hover {
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.5);
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.22);
    }

    .btn-sm {
      padding: 8px 14px;
      font-size: 0.85rem;
      border-radius: 10px;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.88rem;
      margin-top: 14px;
      min-height: 1.2em;
    }

    /* ========== MAIN APP ========== */
    #app {
      display: none;
      max-width: 900px;
      margin: 0 auto;
      padding: 32px 20px 80px;
      opacity: 0;
      transform: translateY(15px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    #app.show {
      display: block;
      opacity: 1;
      transform: translateY(0);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 32px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .logo-icon {
      width: 44px;
      height: 44px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      box-shadow: 0 8px 20px var(--accent-glow);
    }

    .logo h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .header-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .search-bar {
      position: relative;
      flex: 1;
      min-width: 220px;
      max-width: 360px;
    }

    .search-bar input {
      padding-left: 42px;
    }

    .search-bar::before {
      content: "🔍";
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 0.9rem;
      opacity: 0.6;
      pointer-events: none;
    }

    /* Stats Cards */
    .stats {
      display: flex;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .stat-card {
      background: var(--surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 24px;
      flex: 1;
      min-width: 140px;
      transition: transform 0.25s ease, border-color 0.25s ease;
    }

    .stat-card:hover {
      transform: translateY(-2px);
      border-color: var(--border-accent);
    }

    .stat-card .value {
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .stat-card .label {
      font-size: 0.82rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-top: 2px;
    }

    /* Entries List */
    .entries {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .entry-card {
      background: var(--surface);
      backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 22px;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      transition: all 0.25s ease;
      animation: floatIn 0.4s ease forwards;
    }

    .entry-card:hover {
      background: var(--surface-hover);
      border-color: var(--border-accent);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
      transform: translateY(-2px);
    }

    .entry-info h3 {
      font-size: 1.1rem;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .entry-info .username {
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 12px;
    }

    .password-row {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .password-display {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 0.9rem;
      letter-spacing: 1px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      min-width: 130px;
    }

    .entry-actions {
      display: flex;
      gap: 8px;
    }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }

    /* Modal Overlay & Modal */
    .modal-overlay {
      display: flex;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal {
      background: var(--surface-solid);
      border: 1px solid var(--border);
      border-radius: 20px;
      width: 100%;
      max-width: 460px;
      box-shadow: var(--shadow);
      transform: scale(0.92) translateY(10px);
      transition: transform 0.3s ease;
    }

    .modal-overlay.active .modal {
      transform: scale(1) translateY(0);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 22px 26px 16px;
      border-bottom: 1px solid var(--border);
    }

    .modal-close {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 1.4rem;
      cursor: pointer;
      transition: color 0.2s ease;
    }

    .modal-close:hover { color: var(--text); }

    .modal-body { padding: 22px 26px; }

    .modal-footer {
      padding: 16px 26px 24px;
      display: flex;
      gap: 12px;
      justify-content: flex-end;
    }

    .password-gen {
      display: flex;
      gap: 8px;
    }

    .strength {
      height: 4px;
      border-radius: 2px;
      margin-top: 10px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
    }

    .strength-bar {
      height: 100%;
      width: 0%;
      transition: width 0.3s ease, background 0.3s ease;
    }

    /* Toast Notifications */
    .toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--surface-solid);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 22px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: 500;
      z-index: 200;
      opacity: 0;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    .toast.success { border-color: var(--success); }

    @media (max-width: 600px) {
      .entry-card { grid-template-columns: 1fr; }
      .entry-actions { justify-content: flex-end; }
      header { flex-direction: column; align-items: stretch; }
      .search-bar { max-width: none; }
    }
  </style>
</head>
<body>

  <!-- LOCK SCREEN -->
  <div id="lock-screen">
    <div class="lock-card">
      <div class="lock-icon">🔒</div>
      <h1 id="lock-title">Password Vault</h1>
      <p id="lock-subtitle">Enter your master password to unlock</p>

      <div class="form-group">
        <label for="master-password">Master Password</label>
        <input type="password" id="master-password" placeholder="Enter master password" autocomplete="current-password" />
      </div>

      <div class="form-group" id="confirm-group" style="display: none;">
        <label for="confirm-password">Confirm Master Password</label>
        <input type="password" id="confirm-password" placeholder="Confirm master password" autocomplete="new-password" />
      </div>

      <button class="btn btn-primary" id="unlock-btn">Unlock</button>
      <p class="error-msg" id="lock-error"></p>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="app">
    <header>
      <div class="logo">
        <div class="logo-icon">🔑</div>
        <h1>Password Vault</h1>
      </div>
      <div class="header-actions">
        <div class="search-bar">
          <input type="text" id="search-input" placeholder="Search entries..." />
        </div>
        <button class="btn btn-primary btn-sm" id="add-btn">+ Add Entry</button>
        <button class="btn btn-secondary btn-sm" id="lock-btn">Lock</button>
      </div>
    </header>

    <div class="stats">
      <div class="stat-card">
        <div class="value" id="stat-total">0</div>
        <div class="label">Total Entries</div>
      </div>
      <div class="stat-card">
        <div class="value" id="stat-shown">0</div>
        <div class="label">Showing</div>
      </div>
    </div>

    <div class="entries" id="entries-list"></div>
  </div>

  <!-- ADD / EDIT MODAL -->
  <div class="modal-overlay" id="entry-modal">
    <div class="modal">
      <div class="modal-header">
        <h2 id="modal-title">Add Entry</h2>
        <button class="modal-close" id="modal-close">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id" />
        <div class="form-group">
          <label for="entry-title">Title / Site</label>
          <input type="text" id="entry-title" placeholder="e.g. Gmail, GitHub" />
        </div>
        <div class="form-group">
          <label for="entry-username">Username / Email</label>
          <input type="text" id="entry-username" placeholder="user@example.com" />
        </div>
        <div class="form-group">
          <label for="entry-password">Password</label>
          <div class="password-gen">
            <input type="text" id="entry-password" placeholder="Password" />
            <button class="btn btn-secondary btn-sm" type="button" id="gen-password">Generate</button>
          </div>
          <div class="strength"><div class="strength-bar" id="strength-bar"></div></div>
        </div>
        <div class="form-group">
          <label for="entry-url">Website URL (optional)</label>
          <input type="url" id="entry-url" placeholder="https://..." />
        </div>
        <div class="form-group">
          <label for="entry-notes">Notes (optional)</label>
          <textarea id="entry-notes" rows="2" placeholder="Any extra info..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" id="modal-cancel">Cancel</button>
        <button class="btn btn-primary" id="modal-save">Save</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const encoder = new TextEncoder();
    const decoder = new TextDecoder();

    async function deriveKey(password, salt) {
      const keyMaterial = await crypto.subtle.importKey(
        "raw", encoder.encode(password), "PBKDF2", false, ["deriveKey"]
      );
      return crypto.subtle.deriveKey(
        { name: "PBKDF2", salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
      );
    }

    async function encrypt(data, key) {
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const encrypted = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, encoder.encode(JSON.stringify(data)));
      const combined = new Uint8Array(iv.length + encrypted.byteLength);
      combined.set(iv);
      combined.set(new Uint8Array(encrypted), iv.length);
      return btoa(String.fromCharCode(...combined));
    }

    async function decrypt(cipherText, key) {
      const combined = Uint8Array.from(atob(cipherText), (c) => c.charCodeAt(0));
      const iv = combined.slice(0, 12);
      const data = combined.slice(12);
      const decrypted = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, data);
      return JSON.parse(decoder.decode(decrypted));
    }

    let masterKey = null;
    let entries = [];
    let isSetup = false;

    const lockScreen = document.getElementById("lock-screen");
    const app = document.getElementById("app");
    const masterPasswordInput = document.getElementById("master-password");
    const confirmGroup = document.getElementById("confirm-group");
    const confirmPasswordInput = document.getElementById("confirm-password");
    const unlockBtn = document.getElementById("unlock-btn");
    const lockError = document.getElementById("lock-error");
    const lockTitle = document.getElementById("lock-title");
    const lockSubtitle = document.getElementById("lock-subtitle");

    const searchInput = document.getElementById("search-input");
    const addBtn = document.getElementById("add-btn");
    const lockBtn = document.getElementById("lock-btn");
    const entriesList = document.getElementById("entries-list");
    const statTotal = document.getElementById("stat-total");
    const statShown = document.getElementById("stat-shown");

    const entryModal = document.getElementById("entry-modal");
    const modalTitle = document.getElementById("modal-title");
    const modalClose = document.getElementById("modal-close");
    const modalCancel = document.getElementById("modal-cancel");
    const modalSave = document.getElementById("modal-save");
    const editId = document.getElementById("edit-id");
    const entryTitle = document.getElementById("entry-title");
    const entryUsername = document.getElementById("entry-username");
    const entryPassword = document.getElementById("entry-password");
    const entryUrl = document.getElementById("entry-url");
    const entryNotes = document.getElementById("entry-notes");
    const genPasswordBtn = document.getElementById("gen-password");
    const strengthBar = document.getElementById("strength-bar");

    function checkSetup() {
      isSetup = localStorage.getItem("pv_vault") !== null && localStorage.getItem("pv_salt") !== null;
      if (!isSetup) {
        lockTitle.textContent = "Create Vault";
        lockSubtitle.textContent = "Set a strong master password. It cannot be recovered.";
        confirmGroup.style.display = "block";
        unlockBtn.textContent = "Create Vault";
      } else {
        lockTitle.textContent = "Password Vault";
        lockSubtitle.textContent = "Enter your master password to unlock";
        confirmGroup.style.display = "none";
        unlockBtn.textContent = "Unlock";
      }
    }
    checkSetup();

    unlockBtn.addEventListener("click", handleUnlock);
    masterPasswordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleUnlock(); });
    confirmPasswordInput.addEventListener("keydown", (e) => { if (e.key === "Enter") handleUnlock(); });

    async function handleUnlock() {
      const pwd = masterPasswordInput.value;
      lockError.textContent = "";

      if (!pwd || pwd.length < 6) {
        lockError.textContent = "Password must be at least 6 characters.";
        return;
      }

      if (!isSetup) {
        if (pwd !== confirmPasswordInput.value) {
          lockError.textContent = "Passwords do not match.";
          return;
        }
        const salt = crypto.getRandomValues(new Uint8Array(16));
        localStorage.setItem("pv_salt", btoa(String.fromCharCode(...salt)));
        masterKey = await deriveKey(pwd, salt);
        entries = [];
        await saveVault();
        openApp();
      } else {
        try {
          const salt = Uint8Array.from(atob(localStorage.getItem("pv_salt")), (c) => c.charCodeAt(0));
          masterKey = await deriveKey(pwd, salt);
          entries = await decrypt(localStorage.getItem("pv_vault"), masterKey);
          openApp();
        } catch (err) {
          lockError.textContent = "Wrong master password.";
          masterKey = null;
        }
      }
    }

    function openApp() {
      lockScreen.classList.add("hide");
      setTimeout(() => {
        app.classList.add("show");
      }, 200);
      masterPasswordInput.value = "";
      confirmPasswordInput.value = "";
      renderEntries();
    }

    async function saveVault() {
      if (!masterKey) return;
      const cipher = await encrypt(entries, masterKey);
      localStorage.setItem("pv_vault", cipher);
    }

    function renderEntries(filter = "") {
      const q = filter.toLowerCase().trim();
      const filtered = entries.filter((e) =>
        e.title.toLowerCase().includes(q) ||
        e.username.toLowerCase().includes(q) ||
        (e.url || "").toLowerCase().includes(q) ||
        (e.notes || "").toLowerCase().includes(q)
      );

      statTotal.textContent = entries.length;
      statShown.textContent = filtered.length;

      if (filtered.length === 0) {
        entriesList.innerHTML = `
          <div class="empty-state">
            <p>${entries.length === 0 ? "No passwords saved yet. Click “+ Add Entry” to begin." : "No matching entries found."}</p>
          </div>`;
        return;
      }

      entriesList.innerHTML = filtered.map((e, index) => {
        const masked = "•".repeat(Math.min(e.password.length, 12));
        return `
        <div class="entry-card" data-id="${e.id}" style="animation-delay: ${index * 0.05}s">
          <div class="entry-info">
            <h3>${escapeHtml(e.title)}</h3>
            <div class="username">${escapeHtml(e.username)}</div>
            <div class="password-row">
              <span class="password-display" data-real="${escapeAttr(e.password)}">${masked}</span>
              <button class="btn btn-secondary btn-sm toggle-pw">Show</button>
              <button class="btn btn-secondary btn-sm copy-pw">Copy</button>
              ${e.url ? `<a href="${escapeAttr(e.url)}" target="_blank" rel="noopener" class="btn btn-secondary btn-sm">Visit</a>` : ""}
            </div>
          </div>
          <div class="entry-actions">
            <button class="btn btn-secondary btn-sm edit-btn">Edit</button>
            <button class="btn btn-danger btn-sm delete-btn">Delete</button>
          </div>
        </div>`;
      }).join("");

      entriesList.querySelectorAll(".toggle-pw").forEach((btn) => {
        btn.addEventListener("click", () => {
          const span = btn.parentElement.querySelector(".password-display");
          const real = span.dataset.real;
          if (span.textContent.includes("•")) {
            span.textContent = real;
            btn.textContent = "Hide";
          } else {
            span.textContent = "•".repeat(Math.min(real.length, 12));
            btn.textContent = "Show";
          }
        });
      });

      entriesList.querySelectorAll(".copy-pw").forEach((btn) => {
        btn.addEventListener("click", () => {
          const span = btn.parentElement.querySelector(".password-display");
          navigator.clipboard.writeText(span.dataset.real).then(() => {
            showToast("Password copied to clipboard!", true);
          });
        });
      });

      entriesList.querySelectorAll(".edit-btn").forEach((btn) => {
        btn.addEventListener("click", () => openEditModal(btn.closest(".entry-card").dataset.id));
      });

      entriesList.querySelectorAll(".delete-btn").forEach((btn) => {
        btn.addEventListener("click", async () => {
          const id = btn.closest(".entry-card").dataset.id;
          if (confirm("Delete this entry?")) {
            entries = entries.filter((e) => e.id !== id);
            await saveVault();
            renderEntries(searchInput.value);
            showToast("Entry deleted");
          }
        });
      });
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function escapeAttr(str) {
      return String(str).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    searchInput.addEventListener("input", () => renderEntries(searchInput.value));

    addBtn.addEventListener("click", openAddModal);
    modalClose.addEventListener("click", closeModal);
    modalCancel.addEventListener("click", closeModal);
    entryModal.addEventListener("click", (e) => { if (e.target === entryModal) closeModal(); });

    function openAddModal() {
      modalTitle.textContent = "Add Entry";
      editId.value = "";
      entryTitle.value = "";
      entryUsername.value = "";
      entryPassword.value = "";
      entryUrl.value = "";
      entryNotes.value = "";
      updateStrength("");
      entryModal.classList.add("active");
      entryTitle.focus();
    }

    function openEditModal(id) {
      const e = entries.find((x) => x.id === id);
      if (!e) return;
      modalTitle.textContent = "Edit Entry";
      editId.value = e.id;
      entryTitle.value = e.title;
      entryUsername.value = e.username;
      entryPassword.value = e.password;
      entryUrl.value = e.url || "";
      entryNotes.value = e.notes || "";
      updateStrength(e.password);
      entryModal.classList.add("active");
    }

    function closeModal() {
      entryModal.classList.remove("active");
    }

    modalSave.addEventListener("click", async () => {
      const title = entryTitle.value.trim();
      const username = entryUsername.value.trim();
      const password = entryPassword.value;

      if (!title || !password) {
        showToast("Title and password are required");
        return;
      }

      const id = editId.value;
      if (id) {
        const idx = entries.findIndex((e) => e.id === id);
        if (idx !== -1) {
          entries[idx] = { ...entries[idx], title, username, password, url: entryUrl.value.trim(), notes: entryNotes.value.trim() };
        }
      } else {
        entries.push({ id: crypto.randomUUID(), title, username, password, url: entryUrl.value.trim(), notes: entryNotes.value.trim(), created: Date.now() });
      }

      await saveVault();
      closeModal();
      renderEntries(searchInput.value);
      showToast(id ? "Entry updated" : "Entry added", true);
    });

    genPasswordBtn.addEventListener("click", () => {
      const chars = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()-_=+[]{}";
      let pw = "";
      const arr = new Uint32Array(16);
      crypto.getRandomValues(arr);
      for (let i = 0; i < 16; i++) { pw += chars[arr[i] % chars.length]; }
      entryPassword.value = pw;
      updateStrength(pw);
    });

    entryPassword.addEventListener("input", () => updateStrength(entryPassword.value));

    function updateStrength(pw) {
      let score = 0;
      if (pw.length >= 8) score += 25;
      if (pw.length >= 12) score += 15;
      if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score += 20;
      if (/\d/.test(pw)) score += 20;
      if (/[^a-zA-Z0-9]/.test(pw)) score += 20;
      strengthBar.style.width = score + "%";
      if (score < 40) strengthBar.style.background = "var(--danger)";
      else if (score < 70) strengthBar.style.background = "var(--warning)";
      else strengthBar.style.background = "var(--success)";
    }

    lockBtn.addEventListener("click", () => {
      masterKey = null;
      entries = [];
      app.classList.remove("show");
      setTimeout(() => {
        app.style.display = "none";
        lockScreen.classList.remove("hide");
        checkSetup();
        masterPasswordInput.focus();
      }, 300);
    });

    function showToast(msg, success = false) {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = "toast show" + (success ? " success" : "");
      setTimeout(() => toast.classList.remove("show"), 2200);
    }

    masterPasswordInput.focus();
  </script>
</body>
</html>
